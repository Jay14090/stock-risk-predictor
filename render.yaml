services:
  - type: web
    name: stock-risk-predictor
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CACHE_TTL_SECONDS
        value: "180"
      - key: NEWSDATA_API_KEY
        sync: false
